name: Copy Phaser demo from sourceofmana

on:
  push:
    paths:
      - ".github/workflows/copy-phaser-demo.yml"
    branches:
      - main

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copy phaser-demo from source repository
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master https://github.com/vanish994/sourceofmana.git /tmp/sourceofmana
          test -d /tmp/sourceofmana/phaser-demo
          cp -a /tmp/sourceofmana/phaser-demo ./phaser-demo
          rm .github/workflows/copy-phaser-demo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phaser-demo .github/workflows/copy-phaser-demo.yml
          git commit -m "Copy phaser-demo from sourceofmana"
          git push
