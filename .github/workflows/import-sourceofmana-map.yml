name: Import Source of Mana world and assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-sourceofmana-map.yml'
  workflow_dispatch:
    inputs:
      map:
        description: Optional single TMX path to import (leave empty for all maps)
        required: false
        default: ''

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mana
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout Source of Mana
        uses: actions/checkout@v4
        with:
          repository: vanish994/sourceofmana
          path: sourceofmana

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Convert all world maps to Tiled JSON
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/maps
          if [ -n "${{ inputs.map }}" ]; then
            maps="sourceofmana/${{ inputs.map }}"
          else
            maps=$(find sourceofmana/data/maps -type f -name '*.tmx' | sort)
          fi

          while IFS= read -r map; do
            [ -n "$map" ] || continue
            relative="${map#sourceofmana/}"
            map_id="${relative#data/maps/}"
            output="public/assets/maps/${map_id%.tmx}.json"
            echo "Importing $relative -> $output"
            npm run convert:sourceofmana -- --source ./sourceofmana --map "$relative" --out "$output"
          done <<< "$maps"

      - name: Build world map index
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = 'public/assets/maps';
          const maps = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && entry.name.endsWith('.json') && entry.name !== 'map-index.json') {
                const relative = path.relative(root, full).split(path.sep).join('/');
                const id = relative.slice(0, -'.json'.length);
                maps.push({ id, name: id.split('/').at(-1).replace(/[-_]/g, ' ') });
              }
            }
          }
          walk(root);
          maps.sort((a, b) => a.id.localeCompare(b.id));
          fs.writeFileSync(path.join(root, 'map-index.json'), JSON.stringify({ start: maps.some(m => m.id === 'overworld/overworld') ? 'overworld/overworld' : 'tonori/tulimshar/tulimshar', maps }, null, 2) + '\n');
          console.log(`Indexed ${maps.length} maps.`);
          NODE

      - name: Import reusable Source of Mana assets and metadata
        run: |
          set -e
          mkdir -p public/assets/sourceofmana/sprites
          cp -R sourceofmana/data/graphics/sprites/monsters public/assets/sourceofmana/sprites/
          cp -R sourceofmana/data/graphics/sprites/npcs public/assets/sourceofmana/sprites/
          cp -R sourceofmana/data/graphics/sprites/players public/assets/sourceofmana/sprites/
          cp -R sourceofmana/data/graphics/sprites/accessories public/assets/sourceofmana/sprites/
          cp -R sourceofmana/data/graphics/sprites/equipment public/assets/sourceofmana/sprites/
          cp -R sourceofmana/data/graphics/sprites/hairstyles public/assets/sourceofmana/sprites/
          cp -R sourceofmana/data/graphics/items public/assets/sourceofmana/
          cp -R sourceofmana/data/graphics/effects public/assets/sourceofmana/
          cp -R sourceofmana/data/graphics/emotes public/assets/sourceofmana/
          cp -R sourceofmana/data/graphics/minimaps public/assets/sourceofmana/
          cp -R sourceofmana/data/graphics/gui public/assets/sourceofmana/
          cp -R sourceofmana/data/graphics/tilesets public/assets/sourceofmana/
          mkdir -p public/assets/sourceofmana/data
          if [ -d sourceofmana/data/db ]; then cp -R sourceofmana/data/db public/assets/sourceofmana/data/; fi
          if [ -d sourceofmana/data/conf ]; then cp -R sourceofmana/data/conf public/assets/sourceofmana/data/; fi
          cp sourceofmana/LICENSE* public/assets/sourceofmana/ 2>/dev/null || true

      - name: Commit generated world and assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets
          if git diff --cached --quiet; then
            echo "No generated world or asset changes."
            exit 0
          fi
          git commit -m "build: import complete Source of Mana world"
          git push origin main
